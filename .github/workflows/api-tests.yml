# Runs the backend test suite against a real Postgres.
#
# The tests that matter most — certificate numbering under concurrency and the
# uniqueness constraints — only exist at the database level, so a mock would
# assume away exactly what is being tested.
name: API tests

on:
  push:
    paths: ['server/**', '.github/workflows/api-tests.yml']
  pull_request:
    paths: ['server/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: levels
          POSTGRES_PASSWORD: levels
          POSTGRES_DB: levels_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://levels:levels@localhost:5432/levels_test

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run migrate
      - run: npm test
