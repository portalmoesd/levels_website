# Builds the Astro site and publishes it to GitHub Pages.
#
# Enable once under: Settings -> Pages -> Build and deployment -> Source:
# GitHub Actions. The custom domain is configured there too; public/CNAME
# keeps it from being reset on each deploy.
name: Deploy site to GitHub Pages

on:
  push:
    # Includes the repository's current default branch as well as main. The
    # workflow only deploys from whichever branch is actually the default, so
    # listing both is safe before and after a rename to main.
    branches: [main, 'claude/**']
    paths-ignore:
      - 'server/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let a queued one finish rather than
# cancelling it — a cancelled deploy can leave Pages serving a half-built site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Guards against a second branch matching the trigger above and racing the
    # default branch to publish.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx astro check

      - name: Build
        run: npm run build
        env:
          # The pixel ID is public by nature — it ships in the page HTML — so
          # it is a repository variable, not a secret. The Conversions API
          # token is a secret and stays on the Render service.
          PUBLIC_META_PIXEL_ID: ${{ vars.PUBLIC_META_PIXEL_ID }}
          PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE }}
          # Set both of these to preview on the github.io project URL before
          # levels.ge's DNS is moved:
          #   PUBLIC_SITE_URL  https://<user>.github.io
          #   PUBLIC_BASE_PATH /levels_website
          # Leave them unset for production. See docs/deployment.md.
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_BASE_PATH: ${{ vars.PUBLIC_BASE_PATH }}

      # A CNAME file in the artifact sets the custom domain in the Pages
      # settings, which would redirect the github.io URL to a domain whose DNS
      # may not point here yet. So it is written only for a production build.
      - name: Add CNAME for the custom domain
        if: vars.PUBLIC_BASE_PATH == ''
        run: echo 'www.levels.ge' > dist/CNAME

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
