# Builds the Astro site and publishes it to GitHub Pages.
#
# Enable once under: Settings -> Pages -> Build and deployment -> Source:
# GitHub Actions. The custom domain is configured there too; public/CNAME
# keeps it from being reset on each deploy.
name: Deploy site to GitHub Pages

on:
  push:
    # Includes the repository's current default branch as well as main. The
    # workflow only deploys from whichever branch is actually the default, so
    # listing both is safe before and after a rename to main.
    branches: [main, 'claude/**']
    paths-ignore:
      - 'server/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let a queued one finish rather than
# cancelling it — a cancelled deploy can leave Pages serving a half-built site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Guards against a second branch matching the trigger above and racing the
    # default branch to publish.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx astro check

      # Where the site will be served from.
      #
      # Defaults to the GitHub Pages project URL, which always works. Publishing
      # to the real domain is opt-in: set the repository variable
      # PUBLIC_CUSTOM_DOMAIN to www.levels.ge once its DNS points at GitHub.
      #
      # The default matters because the two are not interchangeable. A project
      # URL serves from a subpath (/levels_website), so every link and asset
      # needs that prefix; a custom domain serves from the root and must not
      # have it. Building for the domain before the DNS moves produces a site
      # that returns 200 but loads no CSS and whose every link 404s.
      - name: Resolve deployment target
        id: target
        env:
          CUSTOM_DOMAIN: ${{ vars.PUBLIC_CUSTOM_DOMAIN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            echo "site=https://$CUSTOM_DOMAIN" >> "$GITHUB_OUTPUT"
            echo "base=" >> "$GITHUB_OUTPUT"
            echo "Building for custom domain: https://$CUSTOM_DOMAIN"
          else
            echo "site=https://${OWNER,,}.github.io" >> "$GITHUB_OUTPUT"
            # A <owner>.github.io repository is a user site served from the
            # root; every other repository is a project site on a subpath.
            if [ "${REPO,,}" = "${OWNER,,}.github.io" ]; then
              echo "base=" >> "$GITHUB_OUTPUT"
            else
              echo "base=/$REPO" >> "$GITHUB_OUTPUT"
            fi
            echo "Building for the GitHub Pages project URL (no custom domain set)"
          fi

      - name: Build
        run: npm run build
        env:
          # The pixel ID is public by nature — it ships in the page HTML — so
          # it is a repository variable, not a secret. The Conversions API
          # token is a secret and stays on the Render service.
          PUBLIC_META_PIXEL_ID: ${{ vars.PUBLIC_META_PIXEL_ID }}
          PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE }}
          PUBLIC_SITE_URL: ${{ steps.target.outputs.site }}
          PUBLIC_BASE_PATH: ${{ steps.target.outputs.base }}

      # A CNAME file in the artifact sets the custom domain in the Pages
      # settings, which would redirect the project URL to a domain whose DNS
      # may not point here yet — so it is written only when that domain has
      # been opted into.
      - name: Add CNAME for the custom domain
        if: vars.PUBLIC_CUSTOM_DOMAIN != ''
        run: echo "${{ vars.PUBLIC_CUSTOM_DOMAIN }}" > dist/CNAME

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
